[package]
name = "janus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A TPM 2.0 engine for virtual machines"
# Not published: the name is taken on crates.io. limina consumes this by path.
publish = false

[dependencies]
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
serde_json = "1.0.151"

# `cfg(kani)` gates the proofs `cargo kani` runs.
[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
