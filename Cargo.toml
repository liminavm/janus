[package]
name = "janus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A TPM 2.0 engine for virtual machines"
# Not published: the name is taken on crates.io. limina consumes this by path.
publish = false

[dependencies]
aes = "0.9"
cfb-mode = "0.9"
crypto-bigint = { version = "0.7.5", default-features = false }
crypto-primes = { version = "0.7.2", default-features = false }
hmac = "0.13"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
rand_core = { version = "0.10.1", default-features = false }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["hazmat", "sha2"] }
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
serde_json = "1.0.151"

# `cfg(kani)` gates the proofs `cargo kani` runs; `cfg(fuzzing)`, set by `cargo fuzz`, exposes
# the internal types to the fuzz targets.
[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }
